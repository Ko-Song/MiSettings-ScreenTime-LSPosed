name: Build Debug APK

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Test model contracts
        id: model-tests
        continue-on-error: true
        run: |
          set +e
          gradle --no-daemon --stacktrace testDebugUnitTest
          status=$?
          echo "Model test exit code: ${status}"
          find app/build/test-results app/build/reports/tests -type f -maxdepth 8 -print 2>/dev/null || true
          exit ${status}

      - name: Upload model test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiSettings-ScreenTime-model-test-reports-${{ github.run_number }}
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/problems/**
          if-no-files-found: warn

      - name: Build Debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/debug/app-debug.apk \
            "build_output/MiSettings-ScreenTime-LSPosed-v0.1.${GITHUB_RUN_NUMBER}-debug.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MiSettings-ScreenTime-LSPosed-debug-${{ github.run_number }}
          path: build_output/*.apk
          if-no-files-found: error

      - name: Fail after preserving reports
        if: steps.model-tests.outcome == 'failure'
        run: exit 1
